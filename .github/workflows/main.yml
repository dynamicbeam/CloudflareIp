name: Update IP List

on:
  schedule:
    - cron: '16 16 * * *' # 北京时间每天 00:16 运行
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
  actions: write

jobs:

  update-ip-list:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install beautifulsoup4
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 2
        keep_minimum_runs: 6
        
    - name: Syntax check
      run: |
        python -m py_compile ${{ github.workspace }}/collect_ips.py
        python -m py_compile ${{ github.workspace }}/filter_globalping.py
        python -m py_compile ${{ github.workspace }}/filter_local.py

    - name: Collect candidates
      run: python ${{ github.workspace }}/collect_ips.py

    - name: Measure and filter from China probes
      # 借助 Globalping 的中国大陆探针实测落地机房并排除 HKG，全程在 Action 内完成。
      # 失败时不中断：ip.txt / notslip.txt 保持上一版，只提交 candidates.txt。
      continue-on-error: true
      env:
        GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
      run: python ${{ github.workspace }}/filter_globalping.py

    - name: Commit and push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        if [ -n "$(git status --porcelain candidates.txt ip.txt notslip.txt)" ]; then
          git add candidates.txt ip.txt notslip.txt
          git commit -m "Automatic update"
          git push
        else
          echo "No changes detected, skipping commit."
        fi
