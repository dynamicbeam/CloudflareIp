name: Update IP List

on:
  schedule:
    - cron: '16 16 * * *' # 北京时间每天 00:16 运行
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
  actions: write

jobs:

  update-ip-list:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install beautifulsoup4
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 2
        keep_minimum_runs: 6
        
    - name: Syntax check
      run: |
        python -m py_compile ${{ github.workspace }}/collect_ips.py
        python -m py_compile ${{ github.workspace }}/filter_local.py

    - name: Run script
      run: python ${{ github.workspace }}/collect_ips.py

    - name: Test filter script
      # filter_local.py 平时在本地跑，这里在临时目录空跑一遍验证脚本本身能工作
      run: |
        mkdir -p "$RUNNER_TEMP/filter-test"
        cp "${{ github.workspace }}/candidates.txt" "${{ github.workspace }}/filter_local.py" "$RUNNER_TEMP/filter-test/"
        cd "$RUNNER_TEMP/filter-test"
        python filter_local.py
        echo "--- 生成结果 ---"
        cat ip.txt
        
    - name: Commit and push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        # 只提交候选文件，ip.txt / notslip.txt 由本地 filter_local.py 实测生成
        if [ -n "$(git status --porcelain candidates.txt)" ]; then
          git add candidates.txt
          git commit -m "Automatic update"
          git push
        else
          echo "No changes detected, skipping commit."
        fi
